<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4361ee" />
      <stop offset="100%" style="stop-color:#3a56d4" />
    </linearGradient>
    <linearGradient id="securityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946" />
      <stop offset="100%" style="stop-color:#c1121f" />
    </linearGradient>
    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d6a4f" />
      <stop offset="100%" style="stop-color:#1b4332" />
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#219ebc" />
      <stop offset="100%" style="stop-color:#1a7a94" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7209b7" />
      <stop offset="100%" style="stop-color:#560bad" />
    </linearGradient>
    <linearGradient id="repoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e09f3e" />
      <stop offset="100%" style="stop-color:#c47f17" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#023e8a" />
      <stop offset="100%" style="stop-color:#012a5e" />
    </linearGradient>
    <linearGradient id="ollamaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b5de5" />
      <stop offset="100%" style="stop-color:#7209b7" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="820" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="1">CRANBERRY — SYSTEM ARCHITECTURE</text>
  <line x1="300" y1="45" x2="600" y2="45" stroke="#4361ee" stroke-width="2" opacity="0.6"/>

  <!-- CLIENT LAYER -->
  <rect x="50" y="60" width="800" height="90" rx="10" fill="url(#clientGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="450" y="82" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" opacity="0.8" letter-spacing="2">CLIENT LAYER</text>
  <rect x="80" y="92" width="200" height="42" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="180" y="110" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Customer SPA</text>
  <text x="180" y="126" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.7">Browse · Cart · Checkout</text>
  <rect x="310" y="92" width="200" height="42" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="410" y="110" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Vendor Dashboard</text>
  <text x="410" y="126" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.7">Products · Orders · Analytics</text>
  <rect x="540" y="92" width="200" height="42" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="640" y="110" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Admin Panel</text>
  <text x="640" y="126" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.7">Users · Vendors · Platform</text>
  <text x="815" y="140" fill="#ffffff" font-size="8" text-anchor="end" opacity="0.5">React 18 + Vite + TailwindCSS + Radix UI</text>

  <!-- Arrow Client → Security -->
  <line x1="450" y1="150" x2="450" y2="170" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <polygon points="445,168 450,178 455,168" fill="#ffffff" opacity="0.5"/>
  <text x="480" y="166" fill="#888" font-size="9">HTTPS / REST</text>

  <!-- SECURITY FILTER CHAIN -->
  <rect x="50" y="180" width="800" height="60" rx="10" fill="url(#securityGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="450" y="198" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" opacity="0.8" letter-spacing="2">SECURITY FILTER CHAIN</text>
  <rect x="100" y="208" width="160" height="24" rx="4" fill="#ffffff" fill-opacity="0.15"/>
  <text x="180" y="224" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">CorsFilter</text>
  <text x="290" y="224" fill="#ffffff" font-size="14" opacity="0.6">→</text>
  <rect x="310" y="208" width="160" height="24" rx="4" fill="#ffffff" fill-opacity="0.15"/>
  <text x="390" y="224" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">JwtFilter</text>
  <text x="500" y="224" fill="#ffffff" font-size="14" opacity="0.6">→</text>
  <rect x="520" y="208" width="200" height="24" rx="4" fill="#ffffff" fill-opacity="0.15"/>
  <text x="620" y="224" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle">UsernamePasswordAuthFilter</text>

  <!-- Arrow Security → Application -->
  <line x1="450" y1="240" x2="450" y2="260" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <polygon points="445,258 450,268 455,258" fill="#ffffff" opacity="0.5"/>
  <text x="480" y="256" fill="#888" font-size="9">Authenticated Context</text>

  <!-- APPLICATION LAYER (outer box) -->
  <rect x="50" y="270" width="800" height="310" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="450" y="290" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" opacity="0.8" letter-spacing="2">APPLICATION LAYER</text>

  <!-- Controllers -->
  <rect x="80" y="300" width="540" height="65" rx="8" fill="url(#controllerGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="350" y="318" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">CONTROLLERS (11)</text>
  <text x="350" y="338" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">Auth · Product · Order · Cart · Wishlist · Payment</text>
  <text x="350" y="354" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">Vendor · Admin · User · Health · AI</text>

  <!-- AI Controller highlight -->
  <rect x="650" y="300" width="170" height="65" rx="8" fill="url(#aiGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="735" y="320" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">AI CONTROLLER</text>
  <text x="735" y="338" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">/api/ai/chat</text>
  <text x="735" y="354" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">/api/ai/search · /recommend</text>

  <!-- Arrow Controllers → Services -->
  <line x1="350" y1="365" x2="350" y2="385" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <polygon points="346,383 350,391 354,383" fill="#ffffff" opacity="0.4"/>

  <!-- Service Layer -->
  <rect x="80" y="393" width="380" height="90" rx="8" fill="url(#serviceGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="270" y="413" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">SERVICE LAYER (10)</text>
  <text x="170" y="435" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">AuthService</text>
  <text x="280" y="435" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">ProductService</text>
  <text x="390" y="435" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">OrderService</text>
  <text x="170" y="452" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">CartService</text>
  <text x="280" y="452" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">PaymentService</text>
  <text x="390" y="452" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">VendorService</text>
  <text x="170" y="469" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">AdminService</text>
  <text x="280" y="469" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">WishlistService</text>

  <!-- AI Module -->
  <rect x="490" y="393" width="330" height="90" rx="8" fill="url(#aiGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="655" y="413" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">AI MODULE</text>
  <text x="570" y="435" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">AiService</text>
  <text x="700" y="435" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">AiProviderClient</text>
  <text x="570" y="455" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">RecommendationSvc</text>
  <text x="700" y="455" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">OrderInsightsSvc</text>
  <text x="655" y="475" fill="#ffffff" font-size="8" text-anchor="middle" opacity="0.5">com.cranberry.marketplace.ai</text>

  <!-- Arrow AI Controller → AI Module -->
  <line x1="735" y1="365" x2="655" y2="393" stroke="#9b5de5" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,3"/>

  <!-- Arrow Service → Repository -->
  <line x1="270" y1="483" x2="270" y2="510" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <polygon points="266,508 270,516 274,508" fill="#ffffff" opacity="0.4"/>

  <!-- Repository Layer -->
  <rect x="80" y="518" width="380" height="48" rx="8" fill="url(#repoGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="270" y="539" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">REPOSITORY LAYER (10)</text>
  <text x="270" y="556" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">Spring Data JPA / Hibernate</text>

  <!-- Arrow AI Module → Ollama -->
  <line x1="655" y1="483" x2="655" y2="510" stroke="#9b5de5" stroke-width="1.5" opacity="0.6"/>
  <polygon points="651,508 655,516 659,508" fill="#9b5de5" opacity="0.6"/>

  <!-- Ollama Runtime -->
  <rect x="490" y="518" width="330" height="48" rx="8" fill="url(#ollamaGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="655" y="539" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">OLLAMA RUNTIME</text>
  <text x="655" y="556" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.8">llama3.2 · gemma3 — localhost:11434</text>

  <!-- Arrow Repository → Database -->
  <line x1="270" y1="566" x2="270" y2="600" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="450" y1="590" x2="450" y2="600" stroke="#ffffff" stroke-width="0" opacity="0"/>
  <polygon points="266,598 270,608 274,598" fill="#ffffff" opacity="0.4"/>

  <!-- DATABASE -->
  <rect x="110" y="610" width="680" height="90" rx="10" fill="url(#dbGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="450" y="632" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" opacity="0.8" letter-spacing="2">DATA LAYER</text>
  <text x="450" y="652" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">PostgreSQL (prod) · MySQL 8.0 (dev)</text>
  <text x="450" y="672" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.7">users · vendors · products · orders · order_items</text>
  <text x="450" y="688" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.7">payments · carts · cart_items · wishlists · wishlist_items</text>

  <!-- Dashed connection: AI Module reads from Repositories -->
  <line x1="490" y1="450" x2="460" y2="450" stroke="#9b5de5" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
  <text x="475" y="443" fill="#9b5de5" font-size="7" text-anchor="middle" opacity="0.6">DI</text>

  <!-- Legend -->
  <rect x="50" y="720" width="800" height="80" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="80" y="742" fill="#888" font-size="9" font-weight="600" letter-spacing="1">LEGEND</text>
  <rect x="80" y="752" width="12" height="12" rx="2" fill="#4361ee"/>
  <text x="100" y="762" fill="#aaa" font-size="9">Client / Frontend</text>
  <rect x="200" y="752" width="12" height="12" rx="2" fill="#e63946"/>
  <text x="220" y="762" fill="#aaa" font-size="9">Security</text>
  <rect x="300" y="752" width="12" height="12" rx="2" fill="#2d6a4f"/>
  <text x="320" y="762" fill="#aaa" font-size="9">Controllers</text>
  <rect x="410" y="752" width="12" height="12" rx="2" fill="#219ebc"/>
  <text x="430" y="762" fill="#aaa" font-size="9">Services</text>
  <rect x="510" y="752" width="12" height="12" rx="2" fill="#7209b7"/>
  <text x="530" y="762" fill="#aaa" font-size="9">AI Module</text>
  <rect x="620" y="752" width="12" height="12" rx="2" fill="#e09f3e"/>
  <text x="640" y="762" fill="#aaa" font-size="9">Repository</text>
  <rect x="730" y="752" width="12" height="12" rx="2" fill="#023e8a"/>
  <text x="750" y="762" fill="#aaa" font-size="9">Database</text>
  <line x1="80" y1="778" x2="200" y2="778" stroke="#ffffff" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>
  <text x="210" y="782" fill="#aaa" font-size="9">Dependency Injection</text>
  <line x1="320" y1="778" x2="440" y2="778" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <text x="450" y="782" fill="#aaa" font-size="9">Request Flow</text>
</svg>

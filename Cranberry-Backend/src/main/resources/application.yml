spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cranberry_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:java@2006}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ---------- AI CONFIG (Ollama Local) ----------
ai:
  provider: ollama
  ollama:
    baseUrl: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:gemma3:4b}
    timeout: 60000

# ---------- RAZORPAY CONFIG ----------
razorpay:
  key: ${RAZORPAY_KEY:your_key_here}
  secret: ${RAZORPAY_SECRET:your_secret_here}

# ---------- JWT CONFIG ----------
jwt:
  secret: ${JWT_SECRET:cranberry-marketplace-super-secret-jwt-key-123456}
  expiration: ${JWT_EXPIRATION:86400000}

# ---------- SERVER CONFIG ----------
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
